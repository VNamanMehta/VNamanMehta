<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="V Naman Mehta">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="52%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="200"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1200" height="200" fill="url(#bg)"/>

    <!-- drifting wave layers -->
    <g fill="#ffffff" opacity="0.14">
      <path d="M -700 150 Q -620.0 120.0 -540.0 150 Q -460.0 180.0 -380.0 150 Q -300.0 120.0 -220.0 150 Q -140.0 180.0 -60.0 150 Q 20.0 120.0 100.0 150 Q 180.0 180.0 260.0 150 Q 340.0 120.0 420.0 150 Q 500.0 180.0 580.0 150 Q 660.0 120.0 740.0 150 Q 820.0 180.0 900.0 150 Q 980.0 120.0 1060.0 150 Q 1140.0 180.0 1220.0 150 Q 1300.0 120.0 1380.0 150 Q 1460.0 180.0 1540.0 150 Q 1620.0 120.0 1700.0 150 Q 1780.0 180.0 1860.0 150 Q 1940.0 120.0 2020.0 150 L 1900 200 L -700 200 Z">
        <animateTransform attributeName="transform" attributeType="XML" type="translate"
          from="0 0" to="-320 0" dur="11s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="#ffffff" opacity="0.20">
      <path d="M -700 165 Q -635.0 125.0 -570.0 165 Q -505.0 205.0 -440.0 165 Q -375.0 125.0 -310.0 165 Q -245.0 205.0 -180.0 165 Q -115.0 125.0 -50.0 165 Q 15.0 205.0 80.0 165 Q 145.0 125.0 210.0 165 Q 275.0 205.0 340.0 165 Q 405.0 125.0 470.0 165 Q 535.0 205.0 600.0 165 Q 665.0 125.0 730.0 165 Q 795.0 205.0 860.0 165 Q 925.0 125.0 990.0 165 Q 1055.0 205.0 1120.0 165 Q 1185.0 125.0 1250.0 165 Q 1315.0 205.0 1380.0 165 Q 1445.0 125.0 1510.0 165 Q 1575.0 205.0 1640.0 165 Q 1705.0 125.0 1770.0 165 Q 1835.0 205.0 1900.0 165 L 1900 200 L -700 200 Z">
        <animateTransform attributeName="transform" attributeType="XML" type="translate"
          from="-260 0" to="0 0" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- title + subtitle (gentle fade-in) -->
    <g text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" fill="freeze"/>
      <text x="600" y="88" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="1.5">V Naman Mehta</text>
      <text x="600" y="126" font-size="17" font-weight="600" fill="#eef0fb" opacity="0.92" letter-spacing="0.4">Associate Software Developer @ Talview  •  Desktop Apps  •  Deep Learning &amp; GenAI</text>
    </g>
  </g>
</svg>