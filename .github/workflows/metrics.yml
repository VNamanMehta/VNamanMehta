name: Generate Metrics

on:
  schedule:
    # Runs once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:   # Lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          # IMPORTANT: create a Personal Access Token (see setup notes)
          # and save it as a repo secret named METRICS_TOKEN.
          token: ${{ secrets.METRICS_TOKEN }}
          user: VNamanMehta
          filename: github-metrics.svg
          template: classic
          base: header, activity, metadata
          config_timezone: Asia/Kolkata

          # --- Language breakdown ---
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8

          # --- Coding habits & most-active hours ---
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # --- Lines of code changed ---
          plugin_lines: yes

      # Replaces github-profile-trophy.vercel.app, whose public instance is
      # permanently disabled (HTTP 402). Rendered here and committed as an SVG.
      - name: Generate achievements.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: VNamanMehta
          filename: github-achievements.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
