name: Generate 3D Contribution Skyline

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-contrib
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate the 3D skyline SVGs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move generated SVGs into assets/
        run: |
          mkdir -p assets/profile-3d-contrib
          mv -f profile-3d-contrib/* assets/profile-3d-contrib/
          rmdir profile-3d-contrib

      - name: Commit & push the generated SVGs
        run: |
          if [[ `git status --porcelain` ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -A .
            git commit -m "chore: regenerate 3D contribution skyline"
            git push
          else
            echo "No changes to commit."
          fi
