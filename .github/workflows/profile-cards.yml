name: Refresh Profile Cards

# Draws assets/streak.svg and assets/activity-graph.svg from GitHub's own
# GraphQL API using scripts/generate-cards.mjs, then commits them. The SVG
# templates live in this repo, so no third-party rendering service sits between
# the data and the profile — the only dependency is GitHub itself.

on:
  schedule:
    # Runs once a day at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:   # Lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate cards
        env:
          # METRICS_TOKEN is a PAT with `repo` scope. The default GITHUB_TOKEN
          # only sees public contributions, which would drop the totals
          # substantially — private work is the majority of the count here.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: node scripts/generate-cards.mjs

      - name: Commit refreshed cards
        run: |
          if [[ `git status --porcelain assets` ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "chore: refresh profile cards"
            git push
          else
            echo "Cards unchanged."
          fi
