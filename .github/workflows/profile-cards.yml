name: Refresh Profile Cards

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: node scripts/generate-cards.mjs

      - name: Commit refreshed cards
        run: |
          if [[ `git status --porcelain assets` ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "chore: refresh profile cards"
            git push
          else
            echo "Cards unchanged."
          fi
